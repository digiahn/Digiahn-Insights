backend:
  name: git-gateway
  branch: main

# 미디어 파일 저장 위치
media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

# 한국어 로케일
locale: ko

# 편집기 설정
editor:
  preview: true

# 콘텐츠 컬렉션 정의
collections:

  # ── 포스트 컬렉션 ─────────────────────────────────────────
  - name: "posts"
    label: "📝 분석 포스트"
    label_singular: "포스트"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: true
    fields:
      - label: "제목"
        name: "title"
        widget: "string"
        hint: "SEO를 고려해 핵심 키워드를 앞에 배치하세요."

      - label: "부제목"
        name: "subtitle"
        widget: "string"
        required: false
        hint: "선택 항목 — 제목을 보완하는 한 줄 설명"

      - label: "레이아웃"
        name: "layout"
        widget: "hidden"
        default: "post"

      - label: "카테고리"
        name: "category"
        widget: "select"
        options:
          - { label: "◈ 글로벌 시장 분석", value: "글로벌 시장 분석" }
          - { label: "◉ 지정학 리스크",    value: "지정학 리스크" }
          - { label: "◇ 에너지·차세대 기술", value: "에너지·차세대 기술" }
          - { label: "◎ 위클리 브리핑",    value: "위클리 브리핑" }

      - label: "태그"
        name: "tags"
        widget: "list"
        allow_add: true
        hint: "쉼표로 구분 (예: 반도체, 미중갈등, AI)"

      - label: "발행일"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false

      - label: "예상 읽기 시간 (분)"
        name: "reading_time"
        widget: "number"
        default: 7
        value_type: "int"
        min: 1
        max: 30

      - label: "핵심 인사이트"
        name: "key_point"
        widget: "text"
        required: false
        hint: "포스트 상단 강조 박스에 표시되는 한 줄 핵심 요약"

      - label: "목록 요약 (excerpt)"
        name: "excerpt"
        widget: "text"
        hint: "홈·아카이브 목록에 표시되는 2~3줄 요약문"

      - label: "본문"
        name: "body"
        widget: "markdown"
        hint: "마크다운 형식으로 작성하세요."

  # ── 위클리 브리핑 (별도 템플릿) ──────────────────────────
  - name: "weekly"
    label: "📰 위클리 브리핑"
    label_singular: "브리핑"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-weekly-brief"
    filter:
      field: "category"
      value: "위클리 브리핑"
    fields:
      - label: "제목"
        name: "title"
        widget: "string"
        default: "위클리 글로벌 브리핑 — {{year}}년 {{month}}월 {{day}}일"

      - label: "레이아웃"
        name: "layout"
        widget: "hidden"
        default: "post"

      - label: "카테고리"
        name: "category"
        widget: "hidden"
        default: "위클리 브리핑"

      - label: "태그"
        name: "tags"
        widget: "list"
        default: ["위클리브리핑", "글로벌이슈"]

      - label: "발행일"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false

      - label: "예상 읽기 시간 (분)"
        name: "reading_time"
        widget: "number"
        default: 5
        value_type: "int"

      - label: "핵심 인사이트"
        name: "key_point"
        widget: "text"
        required: false

      - label: "목록 요약"
        name: "excerpt"
        widget: "text"

      - label: "본문"
        name: "body"
        widget: "markdown"

  # ── 페이지 컬렉션 ─────────────────────────────────────────
  - name: "pages"
    label: "📄 페이지"
    files:
      - label: "소개 페이지"
        name: "about"
        file: "about.md"
        fields:
          - label: "제목"
            name: "title"
            widget: "hidden"
            default: "소개"
          - label: "레이아웃"
            name: "layout"
            widget: "hidden"
            default: "default"
          - label: "본문"
            name: "body"
            widget: "markdown"

  # ── 사이트 설정 ───────────────────────────────────────────
  - name: "settings"
    label: "⚙️ 사이트 설정"
    files:
      - label: "기본 설정"
        name: "config"
        file: "_config.yml"
        fields:
          - label: "사이트 제목"
            name: "title"
            widget: "string"
          - label: "사이트 설명"
            name: "description"
            widget: "string"
          - label: "작성자"
            name: "author"
            widget: "string"
          - label: "네이버 블로그 URL"
            name: "naver_blog"
            widget: "string"
